<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AstroMap</title>
<!-- Короткая ссылка для профиля польского TikTok: astromap.me/pl.
     Сразу уводит на воронку с метками, без которых не работают язык,
     статистика и передача оплаты из TikTok в браузер (?src=tiktok):
       src=tiktok        — канал TikTok и передача оплаты;
       utm_campaign=pl   — отдельная строка «TikTok «pl»» на /stats;
       lang=pl           — язык воронки.
     Заход считается уже на главной (один раз на вкладку), здесь — нет. -->
<script>
location.replace('/?src=tiktok&utm_campaign=pl&lang=pl' + (location.search ? '&' + location.search.slice(1) : '') + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/?src=tiktok&amp;utm_campaign=pl&amp;lang=pl">
<style>html,body{margin:0;height:100%;background:#3A0F3F}</style>
</head>
<body></body>
</html>
