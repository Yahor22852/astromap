<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AstroMap App</title>
<script>
/* Тот же бутстрап, что в index.html: список языков держать в паре. */
(function () {
  var SUPPORTED = ['en', 'pl', 'ru', 'uk', 'de', 'es', 'fr', 'it', 'pt', 'tr'];
  var l = null;
  try { l = localStorage.getItem('astromap.lang'); } catch (e) {}
  if (!l) {
    var cands = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < cands.length && !l; i++) {
      var code = String(cands[i]).slice(0, 2).toLowerCase();
      if (SUPPORTED.indexOf(code) >= 0) { l = code; }
    }
  }
  if (!l || SUPPORTED.indexOf(l) < 0) { l = 'en'; }
  window.ASTROMAP_LANG = l;
  document.documentElement.lang = l;
})();
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/flow.css">
<link rel="stylesheet" href="css/reading.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <svg class="s1" viewBox="0 0 100 100"><path d="M50 0C53 34 66 47 100 50 66 53 53 66 50 100 47 66 34 53 0 50 34 47 47 34 50 0Z" fill="#E8C57F"/></svg>
  <svg class="s2" viewBox="0 0 100 100"><path d="M50 0C53 34 66 47 100 50 66 53 53 66 50 100 47 66 34 53 0 50 34 47 47 34 50 0Z" fill="#F5EFE4"/></svg>
  <svg class="s4" viewBox="0 0 100 100"><path d="M50 0C53 34 66 47 100 50 66 53 53 66 50 100 47 66 34 53 0 50 34 47 47 34 50 0Z" fill="#F5EFE4"/></svg>
</div>

<div class="app">
  <header class="top">
    <div class="top__row">
      <span class="top__brand">AstroMap App</span>
      <span class="lang" role="group" aria-label="Language">
        <button class="lang__b lang__toggle" id="langToggle" type="button"
          aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu">EN</button>
        <div class="langmenu" id="langMenu" role="listbox" hidden>
          <button class="langmenu__item" type="button" data-lang="en" role="option">English</button>
          <button class="langmenu__item" type="button" data-lang="pl" role="option">Polski</button>
          <button class="langmenu__item" type="button" data-lang="ru" role="option">Русский</button>
          <button class="langmenu__item" type="button" data-lang="uk" role="option">Українська</button>
          <button class="langmenu__item" type="button" data-lang="de" role="option">Deutsch</button>
          <button class="langmenu__item" type="button" data-lang="es" role="option">Español</button>
          <button class="langmenu__item" type="button" data-lang="fr" role="option">Français</button>
          <button class="langmenu__item" type="button" data-lang="it" role="option">Italiano</button>
          <button class="langmenu__item" type="button" data-lang="pt" role="option">Português</button>
          <button class="langmenu__item" type="button" data-lang="tr" role="option">Türkçe</button>
        </div>
      </span>
    </div>
  </header>

  <main>
    <!-- нет сохранённой карты -->
    <section class="rd hidden" id="empty">
      <h1 class="h1" id="emptyTitle"></h1>
      <p class="hint" id="emptyText"></p>
      <a class="cta cta--link" href="index.html" id="emptyBack"></a>
    </section>

    <!-- разбор -->
    <section class="rd hidden" id="report">
      <h1 class="h1" id="rTitle"></h1>
      <p class="rd__meta" id="rMeta"></p>

      <h2 class="rd__h" id="hPositions"></h2>
      <div id="positions"></div>

      <h2 class="rd__h" id="hThemes"></h2>
      <div id="themes"></div>

      <h2 class="rd__h" id="hWeek"></h2>
      <p class="rd__week" id="weekRange"></p>
      <div id="week"></div>
      <p class="rd__note" id="weekNote"></p>

      <h2 class="rd__h" id="hPair"></h2>
      <div id="pair"></div>

      <p class="rd__disc" id="disc"></p>
    </section>
  </main>
</div>

<script src="js/cities.js"></script>
<script src="js/astro.js"></script>
<script src="js/copy.js"></script>
<script src="js/reading-copy.js"></script>
<script src="js/reading.js"></script>
</body>
</html>
