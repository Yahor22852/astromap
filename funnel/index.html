<script>
/* Страница открыта внутри нашего же окна оплаты (ссылка Gumroad «Continue
   shopping» ведёт обратно на astromap.me прямо в iframe). Ничего не
   рисуем, ничего не считаем и просим окно закрыться — человек и так уже на
   этой странице, снаружи. Чужие сайты, встроившие нас, сюда не попадают:
   доступ к адресу родителя есть только при общем origin. */
(function () {
  var framedByUs = false;
  try { framedByUs = window.self !== window.top && window.parent.location.origin === location.origin; } catch (e) {}
  if (!framedByUs) { return; }
  window.ASTROMAP_FRAMED = true;
  document.documentElement.style.display = 'none';
  try { window.parent.postMessage('astromap:close-pay', location.origin); } catch (e) {}
})();
</script>
<script>
/* ВСТРОЕННЫЙ БРАУЗЕР TIKTOK И ПЕРЕДАЧА В НАСТОЯЩИЙ.

   Здесь две вещи. Первая — признак «мы внутри TikTok» (window.ASTROMAP_INAPP):
   по нему flow.js открывает чекаут Gumroad окном поверх страницы, а не
   переходом, который TikTok блокирует (см. openEmbeddedCheckout).

   Вторая — запасной путь из этого окна: ссылка «Скопировать»
     astromap.me/?go=monthly&h=<ответы квиза>
   Вставленная в Safari/Chrome, она разбирается ниже: ответы квиза
   кладутся в localStorage (у встроенного браузера оно своё, и без этого
   продукт после оплаты попросил бы дату рождения заново), ставится отметка
   «ушёл на оплату», адрес стирается и страница уходит на чекаут. В Gumroad
   ответы не попадают: адрес стирается до ухода, а на чужой домен браузер
   отдаёт только origin. Старые ссылки с #h по-прежнему понимаются.

   Через «••• → Открыть в браузере» TikTok передаёт ИСХОДНУЮ ссылку из
   профиля, а не текущий адрес, поэтому этот путь ответов не переносит.

   Ссылки чекаута — те же, что CHECKOUT_URL / CHECKOUT_URL_YEAR в
   js/flow.js. Меняешь там — меняй и здесь. */
(function () {
  /* Признак встроенного браузера — не только по словам TikTok в
     user-agent: у разных версий и платформ строка разная, и на одном
     телефоне второй тестов TikTok не распознавался — страница делала
     автоматический переход, и TikTok показывал экран блокировки. Поэтому
     ещё и общий признак встроенного браузера:
       iPhone — у Safari, Chrome, Firefox и Edge в user-agent всегда есть
         «Safari/», у встроенных браузеров приложений (WKWebView) — нет.
         Сайт с домашнего экрана тоже без «Safari/», его отличает
         navigator.standalone.
       Android — встроенный браузер (WebView) помечен «; wv)». */
  var ua = navigator.userAgent;
  var INAPP = /musical_ly|bytedance|tiktok|trill_|aweme|bytelocale/i.test(ua) ||
    (/iPhone|iPad|iPod/.test(ua) && !/Safari\//.test(ua) && navigator.standalone !== true) ||
    (/Android/.test(ua) && /; wv\)/.test(ua));
  /* Проверка без телефона: localStorage.setItem('astromap.qa.inapp', '1')
     в консоли включает тот же режим, removeItem — выключает. */
  try { if (localStorage.getItem('astromap.qa.inapp') === '1') { INAPP = true; } } catch (e) {}
  window.ASTROMAP_INAPP = INAPP;
  /* Для ?fpdebug: три последних захода — когда, внутри TikTok или нет, с
     каким адресом (параметр h с ответами вырезан). По ним видно, открыл ли
     TikTok по «Открыть в браузере» ссылку с ?src=tiktok. */
  try {
    if (!/[?&]fpdebug(=|&|$)/.test(location.search)) {
      var log = JSON.parse(localStorage.getItem('astromap.dbg.landings') || '[]');
      log.unshift({ at: new Date().toISOString().slice(11, 19), inapp: INAPP,
        url: location.pathname + location.search.replace(/([?&]h=)[^&]*/, '$1…') });
      localStorage.setItem('astromap.dbg.landings', JSON.stringify(log.slice(0, 3)));
    }
  } catch (e) {}
  var CHECKOUT = {
    monthly: 'https://astromap.gumroad.com/l/astromap?monthly=true&wanted=true',
    yearly: 'https://astromap.gumroad.com/l/astromap?yearly=true&wanted=true'
  };
  var LANGS = ['en', 'pl', 'ru', 'uk', 'de', 'es', 'fr', 'it', 'pt', 'tr'];
  if (window.ASTROMAP_FRAMED) { return; }
  try {
    var q = new URLSearchParams(location.search);
    var plan = q.get('go');
    if (!CHECKOUT[plan] || INAPP) { return; }
    var h = (location.hash.match(/[#&]h=([^&]+)/) || [])[1] || q.get('h');
    if (h) {
      var bin = atob(h.replace(/-/g, '+').replace(/_/g, '/'));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
      var data = JSON.parse(new TextDecoder().decode(bytes));
      if (data && data.f && data.f.dob && data.f.dob.y) {
        localStorage.setItem('astromap.funnel', JSON.stringify(data.f));
      }
      var variant = data && data.f && data.f.v === 'q2' ? 'q2' : 'a';
      if (data && LANGS.indexOf(data.l) >= 0) { localStorage.setItem('astromap.lang', data.l); }
    }
    localStorage.setItem('astromap.checkout', JSON.stringify({ plan: plan, at: Date.now() }));
    sessionStorage.setItem('astromap.checkoutTab', '1');
    /* Этот переход — не новый заход по ссылке, а продолжение того же. */
    sessionStorage.setItem('astromap.visit', '1');
    window.ASTROMAP_HANDOFF = true;
    history.replaceState(null, '', location.pathname);
    /* Метка варианта эксперимента — см. withVariant() в flow.js. */
    location.replace(CHECKOUT[plan] + '&astro_v=' + (typeof variant === 'string' ? variant : 'a'));
  } catch (e) { /* битая ссылка — просто показываем воронку */ }
})();
</script>
<script>
/* Заход по ссылке — один на вкладку, в счётчик cf-worker/visits.js.
   Источник — ?utm_source (или короткое ?src), кампания — ?utm_campaign;
   без меток — домен, с которого перешли, иначе direct. Отправляется ДО
   переадресации ниже, чтобы купившие, пришедшие по ссылке, тоже
   считались: sendBeacon доживает до конца запроса и после ухода со страницы.

   Метка в sessionStorage — чтобы смена языка (это перезагрузка страницы)
   и «Назад» с чекаута не считались новым заходом. Тело — text/plain: так
   запрос «простой», без предварительного OPTIONS. Ни cookies, ни
   идентификатора человека не отправляется. Пустой VISITS_URL — ничего
   не шлём. */
(function () {
  var VISITS_URL = 'https://astromap-visits.egorrut3030.workers.dev/hit';
  try {
    if (!VISITS_URL || window.ASTROMAP_FRAMED || sessionStorage.getItem('astromap.visit')) { return; }
    sessionStorage.setItem('astromap.visit', '1');
    var q = new URLSearchParams(location.search);
    var source = q.get('utm_source') || q.get('src') || '';
    if (!source && document.referrer) {
      var host = new URL(document.referrer).hostname.replace(/^www\./, '');
      if (host && host !== location.hostname) { source = host; }
    }
    var body = JSON.stringify({ source: source || 'direct', campaign: q.get('utm_campaign') || '' });
    var blob = new Blob([body], { type: 'text/plain' });
    if (!(navigator.sendBeacon && navigator.sendBeacon(VISITS_URL, blob))) {
      fetch(VISITS_URL, { method: 'POST', body: blob, keepalive: true, mode: 'no-cors' })
        .catch(function () {});
    }
  } catch (e) { /* приватный режим или старый браузер — без счётчика */ }
})();
</script>
<script>
/* Воронка и продукт живут на одном адресе (astromap.me и astromap.me/product/),
   но человек, который уже купил, не должен снова проходить квиз и пейволл.
   Поэтому до отрисовки чего-либо:

   - доступ подтверждён (astromap.access, его пишет гейт продукта) → сразу в
     продукт;
   - доступа нет, но за последние трое суток человек ушёл на оплату
     (astromap.checkout, пишет flow.js перед переходом на Gumroad) → на гейт
     продукта в режиме «ключ пришёл на почту». Там же есть ссылка обратно на
     оплату — на случай, если он её не завершил.

   Один домен здесь не случайность: localStorage общий только в пределах
   одного origin, а продукт забирает из него данные квиза (astromap.funnel).
   Вынести продукт на поддомен значит потерять этот стык.

   ?funnel в адресе отключает переадресацию — чтобы можно было посмотреть
   воронку с браузера, где продукт уже открыт. */
(function () {
  /* Пришёл из TikTok в настоящий браузер (?src=tiktok — это ссылка из
     профиля, которую TikTok отдаёт по «Открыть в браузере»): сначала
     flow.js спрашивает воркер, нет ли ожидающей оплаты с этого телефона
     (кнопка «Оплатить через Apple Pay» в TikTok), и только если нет —
     вызывает эту переадресацию сам. Иначе старая отметка «ушёл на оплату»
     увела бы на гейт раньше, чем мы узнаем, что человек пришёл платить. */
  window.ASTROMAP_PAID_REDIRECT = paidRedirect;
  if (window.ASTROMAP_FRAMED) { return; }
  if (!window.ASTROMAP_INAPP && /[?&]src=tiktok(&|$)/.test(location.search)) {
    window.ASTROMAP_TT_ARRIVAL = true;
    return;
  }
  paidRedirect();
  function paidRedirect() {
  try {
    if (window.ASTROMAP_HANDOFF) { return; }   /* уже уходим на чекаут */
    /* Внутри TikTok — никаких автоматических переходов. Его браузер
       блокирует переход, который страница делает сама, без нажатия:
       купивший (или просто открывший окно оплаты) человек, вернувшись на
       astromap.me, видел вместо сайта «Open this link in your browser» с
       адресом product/?paid=1. Там остаётся воронка, а вход — по ссылке
       «Войти» на первом экране, то есть по нажатию. */
    if (window.ASTROMAP_INAPP) { return; }
    if (/[?&](funnel|fpdebug)(=|&|$)/.test(location.search)) { return; }
    var a = JSON.parse(localStorage.getItem('astromap.access') || 'null');
    if (a && a.email && a.licenseKey) { window.ASTROMAP_LEAVING = true; location.replace('product/'); return; }
    /* Та же вкладка, из которой уходили на оплату (sessionStorage живёт до
       закрытия вкладки), — это почти всегда «Назад» с чекаута Gumroad без
       оплаты. Его не отправляем на гейт с «ключ летит на почту». */
    if (sessionStorage.getItem('astromap.checkoutTab')) { return; }
    /* Пришёл из TikTok по ссылке из профиля, а ожидающей оплаты не нашлось:
       отметка «ушёл на оплату» тут почти наверняка старая, и экран «ключ
       летит на почту» человеку, который пришёл покупать, только мешает. */
    if (window.ASTROMAP_TT_ARRIVAL) { return; }
    var co = JSON.parse(localStorage.getItem('astromap.checkout') || 'null');
    if (co && co.at && Date.now() - co.at < 72 * 3600 * 1000) {
      /* Флаг для flow.js: страница уходит, шаги воронки не считаем. */
      window.ASTROMAP_LEAVING = true;
      location.replace('product/?paid=1');
    }
  } catch (e) { /* приватный режим — просто показываем воронку */ }
  }
})();
</script>
<script>
/* Язык выбирается до загрузки текстов: copy.js читает window.ASTROMAP_LANG.
   SUPPORTED держать в паре с ключами в copy.js и reading-copy.js и с пунктами
   меню #langMenu ниже. Ключ общий с продуктом — astromap.lang, поэтому язык,
   выбранный до оплаты, открывается и после неё.

   Если явного выбора ещё нет, один раз подставляем язык браузера
   (navigator.languages) — это не геолокация, а стандартный сигнал
   предпочтения, доступный статичному сайту. Так же сделано в продукте. */
(function () {
  var SUPPORTED = ['en', 'pl', 'ru', 'uk', 'de', 'es', 'fr', 'it', 'pt', 'tr'];
  var l = null;
  try { l = localStorage.getItem('astromap.lang'); } catch (e) {}
  if (!l) {
    var cands = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < cands.length && !l; i++) {
      var code = String(cands[i]).slice(0, 2).toLowerCase();
      if (SUPPORTED.indexOf(code) >= 0) { l = code; }
    }
  }
  if (!l || SUPPORTED.indexOf(l) < 0) { l = 'en'; }
  window.ASTROMAP_LANG = l;
  document.documentElement.lang = l;
})();
</script>
<script>
/* ВОРОНКА: основная — квиз v2 ('q2', js/quiz.js). Прежняя воронка ('a',
   экраны s1–s7 в flow.js) осталась в коде как запасная и открывается только
   по ?quiz=1 — в этой вкладке, без запоминания, чтобы случайная ссылка не
   закрепила человека в старой версии. Старое значение astromap.variant
   (времён теста 50/50) больше не читается: все видят квиз v2.

   ASTROMAP_TEST — проверочный заход: ?src=test…/utm_source=test…, метки
   deploy…/…check… (те же правила, что у сводки заходов) и localhost. Шаги
   воронки с такой вкладки не отправляются. */
(function () {
  var v = 'q2';
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('quiz') === '1') { sessionStorage.setItem('astromap.oldFunnel', '1'); }
    if (q.get('quiz') === '2') { sessionStorage.removeItem('astromap.oldFunnel'); }
    if (sessionStorage.getItem('astromap.oldFunnel') === '1') { v = 'a'; }
    var src = String(q.get('utm_source') || q.get('src') || '').toLowerCase();
    var test = /^test|^deploy|check/.test(src) || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    if (test) { sessionStorage.setItem('astromap.test', '1'); }
    window.ASTROMAP_TEST = test || sessionStorage.getItem('astromap.test') === '1';
  } catch (e) { v = 'q2'; }
  window.ASTROMAP_VARIANT = v;
  document.documentElement.setAttribute('data-variant', v);
})();
</script>

  <svg class="s2" viewBox="0 0 100 100"><path d="M50 0C53 34 66 47 100 50 66 53 53 66 50 100 47 66 34 53 0 50 34 47 47 34 50 0Z" fill="#FFFFFF"/></svg>
  <svg class="s3" viewBox="0 0 100 100"><path d="M50 0C53 34 66 47 100 50 66 53 53 66 50 100 47 66 34 53 0 50 34 47 47 34 50 0Z" fill="#F8D3EC"/></svg>

<div class="app">

  <header class="top" id="top">
    <div class="top__pill">
      <div class="top__row">
        <!-- Назад и фазы — только у квиза v2 (js/quiz.js). -->
        <button class="top__back hidden" id="qBack" type="button"></button>
        <span class="top__brand" data-t="brand"></span>
        <span class="top__right">
        <!-- Десяти языкам не хватит места рядными пилюлями, как хватало
             двум: кнопка с текущим кодом раскрывает список родных названий.
             Тот же приём, что в шапке продукта. -->
        <span class="lang" role="group" aria-label="Language">
          <button class="lang__b lang__toggle" id="langToggle" type="button"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu">EN</button>
          <div class="langmenu" id="langMenu" role="listbox" hidden>
            <button class="langmenu__item" type="button" data-lang="en" role="option">English</button>
            <button class="langmenu__item" type="button" data-lang="pl" role="option">Polski</button>
            <button class="langmenu__item" type="button" data-lang="ru" role="option">Русский</button>
            <button class="langmenu__item" type="button" data-lang="uk" role="option">Українська</button>
            <button class="langmenu__item" type="button" data-lang="de" role="option">Deutsch</button>
            <button class="langmenu__item" type="button" data-lang="es" role="option">Español</button>
            <button class="langmenu__item" type="button" data-lang="fr" role="option">Français</button>
            <button class="langmenu__item" type="button" data-lang="it" role="option">Italiano</button>
            <button class="langmenu__item" type="button" data-lang="pt" role="option">Português</button>
            <button class="langmenu__item" type="button" data-lang="tr" role="option">Türkçe</button>
          </div>
        </span>
          <span class="top__pct" id="pct"></span>
        </span>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           data-tlabel="a11y.progress">
        <i class="bar__seg"></i><i class="bar__seg"></i><i class="bar__seg"></i><i class="bar__seg"></i><i class="bar__seg"></i>
      </div>
    </div>
  </header>

  <main>

    <!-- ===================================================== 1. дата -->
    <section class="scr is-active" id="s1">
      <p class="eyebrow" data-t="s1.eyebrow"></p>
      <h1 class="h1" data-t="s1.title"></h1>
      <div class="fields">
        <div class="field">
          <label class="field__lab" for="d1" data-t="s1.day"></label>
          <select id="d1"></select>
        </div>
        <div class="field">
          <label class="field__lab" for="m1" data-t="s1.month"></label>
          <select id="m1"></select>
        </div>
        <div class="field">
          <label class="field__lab" for="y1" data-t="s1.year"></label>
          <select id="y1"></select>
        </div>
      </div>
      <!-- Результат первого шага — не строчка, а первая точка на карте.
           Круг и легенда рисуются одним и тем же кодом на всех экранах
           (js/wheel.js), поэтому на третьем экране это буквально та же
           карта, в которую доехали ещё две точки. -->
      <div class="res hidden" id="s1res">
        <div class="mapbox" id="s1map"></div>
        <div class="res__lab" data-t="s1.resultLabel"></div>
        <div class="res__val" id="s1sign"></div>
        <div class="res__txt" id="s1line"></div>
        <div class="res__meta" id="s1el"></div>
        <p class="mapnote" id="s1mapnote"></p>
      </div>
      <!-- Вход для тех, кто уже купил, но открыл сайт на новом устройстве
           или после очистки браузера: переадресация в <head> их не видит. -->
      <p class="signin"><span data-t="access.s1Q"></span> <a href="product/" data-t="access.s1Link"></a></p>
    </section>

    <!-- ===================================================== 2. темы -->

      <p class="eyebrow" data-t="s2.eyebrow"></p>
      <h1 class="h1" data-t="s2.title"></h1>
      <p class="hint" data-t="s2.hint"></p>
      <div class="tiles" id="tiles" role="group" data-tlabel="a11y.themes"></div>
    </section>

    <!-- ===================================================== 3. время и место -->

      <p class="eyebrow" data-t="s3.eyebrow"></p>
      <h1 class="h1" data-t="s3.title"></h1>
      <p class="hint" data-t="s3.hint"></p>
      <div class="fields">
        <div class="field">
          <label class="field__lab" for="hh" data-t="s3.hour"></label>
          <select id="hh"></select>
        </div>
        <div class="field">
          <label class="field__lab" for="mm" data-t="s3.minute"></label>
          <select id="mm"></select>
        </div>
      </div>
      <label class="check">
        <input type="checkbox" id="noTime">
        <span data-t="s3.unknown"></span>
      </label>
      <!-- Город ищется, а не выбирается из списка: список один на все десять
           языков и в нём 864 города — прокруткой такой не берут. Поиск
           понимает кириллицу и местные написания (см. cities.js). -->
      <div class="fields fields--stack">
        <div class="field field--wide citypick">
          <label class="field__lab" for="city" data-t="s3.city"></label>
          <!-- Поле и подсказки в отдельной обёртке: меню отсчитывается от её
               низа, то есть висит прямо под полем, а не под ссылкой ручного
               ввода, как было, когда якорем служил весь .citypick. -->
          <div class="citypick__box">
            <input type="text" id="city" class="citypick__input" autocomplete="off"
              role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="cityMenu">
            <div class="citypick__menu" id="cityMenu" role="listbox" hidden></div>
          </div>
          <input type="hidden" id="cityJson" value="">
          <button type="button" class="citypick__manualtoggle" id="cityManual"></button>
          <div class="citypick__manualbox" id="cityManualBox" hidden>
            <input type="text" id="cityManualName" autocomplete="off">
            <select id="cityManualOffset"></select>
            <button type="button" class="citypick__manualapply" id="cityManualApply"></button>
          </div>
        </div>
      </div>
      <!-- Стадии расчёта. Каждая строка соответствует операции, которая
           действительно выполняется в этот момент (см. calcChart в flow.js);
           выдуманных шагов здесь нет. -->
      <ol class="calc hidden" id="calc"></ol>
      <div class="mapbox hidden" id="s3map"></div>

      <!-- Большая тройка одним объектом, а не тремя карточками подряд:
           Солнце, Луна и Асцендент — это одна конфигурация, и три
           отдельных блока читались бы как три независимых результата. -->
      <div class="big3 hidden" id="big3"></div>
      <p class="res__meta hidden" id="s3note"></p>
    </section>

    <!-- ===================================================== 4. партнёр -->
    <section class="scr" id="s4">
      <p class="eyebrow" data-t="s4.eyebrow"></p>
      <h1 class="h1" data-t="s4.title"></h1>
      <p class="hint" data-t="s4.hint"></p>
      <div class="fields">
        <div class="field">
          <label class="field__lab" for="d2" data-t="s1.day"></label>
          <select id="d2"></select>
        </div>
        <div class="field">
          <label class="field__lab" for="m2" data-t="s1.month"></label>
          <select id="m2"></select>
        </div>
        <div class="field">
          <label class="field__lab" for="y2" data-t="s1.year"></label>
          <select id="y2"></select>
        </div>
      </div>
      <div class="score hidden" id="scoreBox">
        <div class="score__num" id="scoreNum">0</div>
        <div class="score__lab" data-t="s4.scoreLabel"></div>
        <div class="track"><i class="track__fill" id="scoreFill"></i></div>
        <div class="score__t" id="scoreT"></div>
        <div class="score__d" id="scoreD"></div>
        <div class="score__foot" data-t="s4.scoleFoot"></div>
      </div>
    </section>

    <!-- ===================================================== 5. сводка -->
    <section class="scr" id="s5">
      <p class="eyebrow" data-t="s5.eyebrow"></p>
      <h1 class="h1" data-t="s5.title"></h1>
      <!-- Собранная карта, а не сводка формы: круг, который человек строил
           четыре экрана, его основа, его фокус и небо над ней прямо сейчас.
           Таблица «ключ — значение» на этом месте читалась как страница
           подтверждения заказа. -->
      <div class="mapbox" id="s5map"></div>
      <div class="sum" id="sum"></div>

      <!-- Превью продукта на данных этого человека. Считается тем же кодом,
           что и сам продукт (см. js/preview.js), поэтому цифры здесь и после
           оплаты — один расчёт. Если ядро не загрузилось, блок остаётся
           пустым и экран работает как раньше. -->
      <section class="pv hidden" id="pv">
        <h2 class="pv__h" id="pvH"></h2>
        <p class="pv__sub" id="pvSub"></p>
        <div class="pv__tabs" id="pvTabs" role="tablist"></div>
        <div class="pv__body" id="pvBody"></div>
      </section>

      <p class="hint" data-t="s5.ready"></p>
    </section>

    <!-- ===================================================== 6. пейволл -->
    <section class="scr" id="s6">
      <p class="eyebrow" data-t="paywall.eyebrow"></p>
      <h1 class="h1" data-t="paywall.title"></h1>
      <!-- Пейволл показывает ИХ карту и ИХ небо, а не общий прайс: человек
           к этому моменту уже видел продукт в превью, и цена продолжает
           начатое, а не открывает новую сделку. -->
      <p class="pw__me" id="pwMe"></p>

      <!-- Цена стоит сразу под строкой про фокус, а не в конце экрана: до
           переноса она лежала после карты, блока «небо движется» и списка
           «что открывается», то есть ниже сгиба на любом телефоне, и её
           видели только те, кто долистал. Условия подписки (planDisc) едут
           вместе с ценой — это один блок, и разносить их нельзя.
           Строка согласия остаётся внизу, рядом с кнопкой, на которую
           ссылается. -->
      <div class="plan">
        <div class="plan__t" data-t="paywall.planTitle"></div>
        <div class="plan__p" id="planPrice"></div>
        <div class="plan__after" id="planAfter"></div>
        <p class="disc" id="planDisc"></p>
      </div>

      <!-- Ключ приходит на почту — говорим это ДО оплаты, крупно, а не
           мелким шрифтом: иначе после Gumroad человек не знает, что искать. -->
      <div class="keynote">
        <svg class="keynote__ic" viewBox="0 0 48 40" aria-hidden="true">
          <rect x="2" y="8" width="44" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M3.5 10.5 24 25l20.5-14.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="36" cy="8" r="6.5" fill="#3A0F3F" stroke="currentColor" stroke-width="2.4"/>
          <path d="M36 5v6M33 8h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="keynote__t" data-t="access.keyTitle"></div>
          <p class="keynote__d" data-t="access.keyText"></p>
        </div>
      </div>

      <div class="mapbox mapbox--pw" id="pwMap"></div>
      <div class="pw__moves" id="pwMoves"></div>
      <div class="inc" id="inc"></div>

      <!-- Соцдоказательства здесь нет намеренно: цифр пользователей у продукта
           пока не существует. Когда появятся реальные — вставлять сюда,
           селектор .plan + .proof, и только проверяемые формулировки. -->

      <p class="legal" id="legal"></p>
      <p class="legal checkout-note hidden" id="checkoutNote"></p>
      <p class="signin"><span data-t="access.paidQ"></span> <a href="product/" data-t="access.paidLink"></a></p>
    </section>

    <!-- ===================================================== 7. recovery -->
    <section class="scr" id="s7">
      <p class="eyebrow" data-t="paywall.eyebrow"></p>
      <h1 class="h1" data-t="recovery.title"></h1>
      <p class="hint" data-t="recovery.sub"></p>

      <!-- Опроса «что вас остановило» здесь больше нет: отказ от месячного
           плана ведёт прямо к годовому, без промежуточного шага. Блок
           годового плана поэтому и не скрыт — он единственное, что на этом
           экране есть. -->
      <div class="alt" id="altBox">
        <div class="alt__t" data-t="recovery.yearTitle"></div>
        <div class="alt__p" id="onePrice"></div>
        <p class="disc" id="oneDisc"></p>
        <!-- Экран годового плана — это списание денег, значит нужна та же
             строка согласия, что и на пейволле, с названием ЭТОЙ кнопки. -->
        <p class="legal" id="legalYear"></p>
        <p class="legal checkout-note hidden" id="checkoutNoteYear"></p>
      </div>

      <!-- Ключ приходит на почту — говорим это ДО оплаты, крупно, а не
           мелким шрифтом: иначе после Gumroad человек не знает, что искать. -->
      <div class="keynote">
        <svg class="keynote__ic" viewBox="0 0 48 40" aria-hidden="true">
          <rect x="2" y="8" width="44" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M3.5 10.5 24 25l20.5-14.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="36" cy="8" r="6.5" fill="#3A0F3F" stroke="currentColor" stroke-width="2.4"/>
          <path d="M36 5v6M33 8h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="keynote__t" data-t="access.keyTitle"></div>
          <p class="keynote__d" data-t="access.keyText"></p>
        </div>
      </div>
      <p class="signin"><span data-t="access.paidQ"></span> <a href="product/" data-t="access.paidLink"></a></p>
    </section>

  </main>
</div>

<div class="dock">
  <div class="dock__in">
    <button class="cta cta--ghost hidden" id="ghost" type="button"></button>
    <button class="cta" id="cta" type="button" disabled></button>
  </div>
</div>

<script src="js/cities.js"></script>
<script src="js/wheel.js"></script>
<script src="js/preview.js"></script>
<script src="js/astro.js"></script>
<script src="js/copy.js"></script>
<!-- Тексты выбранного языка. В copy.js лежат только en и pl, остальные восемь
     — отдельными файлами по 14–21 КБ, и подключается ровно один: грузить
     все десять ради одного было бы около 350 КБ до первой отрисовки.

     document.write здесь потому, что статике больше нечем: src в разметке
     не бывает динамическим, а любая асинхронная догрузка означала бы, что
     flow.js стартует раньше текстов. Запись синхронная, скрипт свой же,
     не со стороннего домена — это тот случай, где браузеры её не режут.
     Файла нет или не догрузился — COPY остаётся английским, и воронка
     работает дальше. -->
<script>
(function () {
  var l = window.ASTROMAP_LANG;
  if (l && l !== 'en' && l !== 'pl') {
    document.write('<script src="js/lang/' + l + '.js"><\/script>');
  }
})();
</script>
<script src="js/flow.js"></script>
<!-- Квиз v2 — только в его варианте эксперимента: прежней воронке эти
     25 КБ не нужны. Тексты: английский (он же запасной) + один язык. -->
<script>
(function () {
  if (window.ASTROMAP_VARIANT !== 'q2' || window.ASTROMAP_HANDOFF || window.ASTROMAP_FRAMED) { return; }
  var l = window.ASTROMAP_LANG;
  document.write('<script src="js/quiz-copy.js"><\/script>');
  if (l && l !== 'en') { document.write('<script src="js/lang/' + l + '-quiz.js"><\/script>'); }
  document.write('<script src="js/quiz.js"><\/script>');
})();
</script>
</body>
</html>
