<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AstroMap</title>
<!-- Короткая ссылка для профиля испанского TikTok: astromap.me/es.
     Сразу уводит на воронку с метками, без которых не работают язык,
     статистика и передача оплаты из TikTok в браузер (?src=tiktok):
       src=tiktok        — канал TikTok и передача оплаты;
       utm_campaign=es   — отдельная строка «TikTok «es»» на /stats;
       lang=es           — воронка сразу на испанском.
     Заход считается уже на главной (один раз на вкладку), здесь — нет. -->
<script>
location.replace('/?src=tiktok&utm_campaign=es&lang=es' + (location.search ? '&' + location.search.slice(1) : '') + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/?src=tiktok&amp;utm_campaign=es&amp;lang=es">
<style>html,body{margin:0;height:100%;background:#3A0F3F}</style>
</head>
<body></body>
</html>
